<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexChat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Username Modal -->
<div id="usernameModal" class="overlay">
  <div class="modal-box">
    <div class="modal-icon">⚡</div>
    <h1>Welcome to NexChat</h1>
    <p>Pick a username to enter the chat</p>
    <div class="input-group">
      <input id="usernameInput" type="text" placeholder="Your username…" maxlength="20" autocomplete="off" />
    </div>
    <p id="usernameError" class="error-msg hidden">That username is already taken.</p>
    <button id="joinBtn">Enter the Chat</button>
    <p class="modal-footer-note">Your name is visible to all users in the room</p>
  </div>
</div>

<!-- Create Room Modal -->
<div id="createRoomModal" class="overlay hidden">
  <div class="modal-box small">
    <div class="modal-icon sm">#</div>
    <h2>Create a Room</h2>
    <p>Letters, numbers and hyphens only</p>
    <div class="input-group">
      <span class="input-prefix">#</span>
      <input id="roomNameInput" type="text" placeholder="my-awesome-room" maxlength="24" autocomplete="off" />
    </div>
    <p id="roomError" class="error-msg hidden">Room already exists or invalid name.</p>
    <div class="btn-group">
      <button id="cancelRoomBtn" class="btn-secondary">Cancel</button>
      <button id="confirmRoomBtn">Create Room</button>
    </div>
  </div>
</div>

<!-- Main App -->
<div id="app" class="app hidden">

  <!-- Left Sidebar: Rooms -->
  <aside class="sidebar left-sidebar">

    <div class="app-brand">
      <span class="brand-icon">⚡</span>
      <span class="brand-name">NexChat</span>
      <span class="brand-version">v2</span>
    </div>

    <div class="sidebar-heading">Chatrooms</div>

    <nav id="roomList" class="room-list"></nav>

    <div class="sidebar-foot">
      <button id="createRoomBtn" class="new-room-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        New Room
      </button>
    </div>

  </aside>

  <!-- Center: Chat -->
  <main class="chat-section">

    <header class="chat-header">
      <div class="ch-left">
        <span class="room-icon">#</span>
        <span id="currentRoomName">general</span>
      </div>
      <div class="ch-right">
        <span id="roomMemberCount" class="member-tag">0 members</span>
      </div>
    </header>

    <div id="messages" class="messages"></div>

    <div class="message-form">
      <div id="emojiPicker" class="emoji-picker hidden"></div>

      <button id="emojiBtn" class="form-btn" title="Emoji">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
          <line x1="9" y1="9" x2="9.01" y2="9"/>
          <line x1="15" y1="9" x2="15.01" y2="9"/>
        </svg>
      </button>

      <input id="messageInput" type="text" placeholder="Message #general…" autocomplete="off" maxlength="500" />

      <button id="sendBtn" class="send-btn" title="Send">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>

  </main>

  <!-- Right Sidebar: Users -->
  <aside class="sidebar right-sidebar">

    <div class="sidebar-heading">
      Online
      <span id="userCount" class="count-chip">0</span>
    </div>

    <div id="userList" class="user-list"></div>

  </aside>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>
</body>
</html>
